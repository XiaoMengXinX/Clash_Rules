rule-providers:
  # ===== 本地 / 下载 =====
  本地-LAN:
    type: http
    behavior: classical
    interval: 86400
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
  本地-Tailscale:
    type: http
    behavior: classical
    interval: 86400
    format: text
    url: https://raw.githubusercontent.com/XiaoMengXinX/Clash_Rules/master/tailscale.list
  下载工具:
    type: http
    behavior: classical
    interval: 86400
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

  # ===== 广告 =====
  BanAD:
    type: http
    behavior: classical
    interval: 86400
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
  BanProgramAD:
    type: http
    behavior: classical
    interval: 86400
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
